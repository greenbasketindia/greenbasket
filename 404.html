  <!-- Styles are inline on purpose: this page must work from ANY broken URL depth -->
  <style>
    :root {
      --green-900: #143d27; --green-700: #1f5c3a; --green-600: #2a7a4d;
      --green-100: #e6f0e8; --cream: #fbfaf6; --soft: #f3f7f1;
      --ink: #17231c; --muted: #5d6b62; --line: #e3e8e1; --white: #fff;
      --font-head: "Fraunces", Georgia, serif;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      font-family: var(--font-body); line-height: 1.65; color: var(--ink);
      background: linear-gradient(180deg, var(--soft) 0%, var(--cream) 100%);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .icon { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    :focus-visible { outline: 3px solid #e08a3c; outline-offset: 3px; border-radius: 6px; }

    header { padding: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; }
    .brand .icon { width: 28px; height: 28px; color: var(--green-700); }
    .brand span { font-family: var(--font-head); font-size: 1.4rem; font-weight: 600; color: var(--green-900); }

    main { flex: 1; display: grid; place-items: center; padding: 24px 20px 56px; text-align: center; }
    .wrap { max-width: 520px; }

    .code {
      font-family: var(--font-head); font-weight: 600; line-height: 1;
      font-size: clamp(6rem, 28vw, 11rem); color: var(--green-900);
      display: inline-flex; align-items: center; gap: 0.04em;
    }
    .code .leaf {
      width: 0.72em; height: 0.72em; color: var(--green-600);
      stroke-width: 1.6; animation: sway 4s ease-in-out infinite; transform-origin: 50% 90%;
    }
    @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

    .eyebrow { margin: 18px 0 10px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--green-600); }
    h1 { margin: 0; font-family: var(--font-head); font-weight: 600; font-size: clamp(1.7rem, 5vw, 2.3rem); line-height: 1.2; color: var(--green-900); }
    p.lead { margin: 14px 0 0; color: var(--muted); }

    .actions { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 26px; border-radius: 999px; font-weight: 600; font-size: 0.95rem;
      border: 1.5px solid transparent; transition: transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--green-700); color: var(--white); }
    .btn-primary:hover { background: var(--green-900); box-shadow: 0 10px 30px rgba(20,61,39,.15); }
    .btn-outline { color: var(--green-700); border-color: var(--green-700); }
    .btn-outline:hover { background: var(--green-700); color: var(--white); }

    .wrap > * { animation: rise .7s ease both; }
    .wrap > *:nth-child(2) { animation-delay: .08s; }
    .wrap > *:nth-child(3) { animation-delay: .16s; }
    .wrap > *:nth-child(4) { animation-delay: .24s; }
    .wrap > *:nth-child(5) { animation-delay: .32s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    footer { padding: 20px; text-align: center; font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); }

    @media (min-width: 600px) { .actions { flex-direction: row; justify-content: center; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>

        4

      <p class="eyebrow">Page not found</p>

      <div class="actions">
        <a class="btn btn-primary" href="/" data-home>
          Back to Home

        <a class="btn btn-outline" href="#" id="waLink" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
          Order on WhatsApp
        </a>

  <footer>&copy; <span id="year"></span> GreenBasket. All rights reserved.</footer>

  <script>
    (function () {
      // If your repo is named "yourname.github.io" (or you use a custom domain),
      // set BASE to "/" below. Otherwise leave it as null (auto-detect).
      var BASE = null;

      if (BASE === null) {
        var onGithub = location.hostname.slice(-10) === ".github.io";
        var firstSegment = location.pathname.split("/")[1];
        BASE = onGithub && firstSegment ? "/" + firstSegment + "/" : "/";
      }

      document.querySelectorAll("[data-home]").forEach(function (a) { a.href = BASE; });
      document.getElementById("year").textContent = new Date().getFullYear();

      // Reuse the same WhatsApp settings from config.js (number is not repeated here)
      var s = document.createElement("script");
      s.src = BASE + "assets/js/config.js";
      s.onload = function () {
        var c = window.GREENBASKET_CONFIG;
        if (c) document.getElementById("waLink").href =
          "https://wa.me/" + c.whatsapp.number + "?text=" + encodeURIComponent(c.whatsapp.generalMessage);
      };
      document.head.appendChild(s);
    })();
  </script>
