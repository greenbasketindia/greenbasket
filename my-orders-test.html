<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Basket | My Orders TEST</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183522;background:#f4f8f1}*{box-sizing:border-box}body{margin:0}header{background:#0c5f1d;color:white;padding:18px 20px;font-weight:750;font-size:20px}main{max-width:650px;margin:25px auto;padding:0 14px}.card{background:white;border:1px solid #dfebd9;border-radius:20px;padding:24px;box-shadow:0 8px 28px #123f1710}h1{font-size:24px;margin:0 0 8px}p{color:#637465;line-height:1.5;font-size:14px}label{font-weight:650;font-size:13px;display:block;margin:16px 0 8px}input{width:100%;padding:13px;border:1px solid #bacfba;border-radius:10px;font:inherit}button{padding:12px 16px;border:0;border-radius:10px;background:#0c5f1d;color:white;font:inherit;font-weight:700;cursor:pointer;margin-top:14px}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e8f2e4;color:#0c5f1d}.hidden{display:none!important}.error{color:#b42318!important}.order{border:1px solid #dbe9d8;border-radius:14px;padding:16px;margin-top:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.id{font-weight:750;font-size:13px;overflow-wrap:anywhere}.pill{background:#e8f5e8;color:#126126;border-radius:20px;padding:5px 9px;font-size:12px}.amount{font-weight:800;font-size:19px;color:#0c5f1d}.steps{display:flex;gap:3px;margin:14px 0}.step{flex:1;text-align:center;font-size:10px;color:#7b887c}.dot{width:19px;height:19px;border-radius:50%;border:2px solid #cbd9c8;margin:0 auto 6px}.done .dot{background:#0c5f1d;border-color:#0c5f1d}.done{color:#0c5f1d}#recaptcha-container{margin-top:14px;overflow:hidden}.muted{font-size:12px}#message{min-height:22px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:12px}a.back{display:inline-block;background:#e8f2e4;color:#0c5f1d;padding:11px 16px;border-radius:10px;text-decoration:none;font-weight:700;margin-bottom:18px}</style></head>
<body><header>🧺 GREEN BASKET · TEST</header><main><div class="card"><a class="back" href="GreenBasket_TEST_Integrated_v5_1.html">← Back to Shopping</a><h1>My Orders</h1><p id="intro">Checking your Green Basket login…</p>
<section id="login" class="hidden"><label for="mobile">Mobile number (+91)</label><input id="mobile" maxlength="10" inputmode="numeric" autocomplete="tel-national" placeholder="10-digit mobile number"><div id="recaptcha-container"></div><button id="send" type="button">Send OTP</button><div id="verify" class="hidden"><label for="code">6-digit OTP</label><input id="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="OTP"><button id="confirm" type="button">Verify OTP</button></div></section>
<section id="account" class="hidden"><p id="phone"></p><button id="refresh" type="button">↻ Refresh Orders</button> <button id="logout" class="secondary" type="button">Sign out</button><div id="orders"></div></section><p id="message" role="status" aria-live="polite"></p><p class="muted">TEST only. Orders are returned only for the verified Firebase account. Never share your OTP.</p></div></main>
<iframe id="bridge" title="Secure order lookup" hidden referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin" src="https://script.google.com/macros/s/AKfycbzstju0kNmWRLTVnQQUsr5gMH2RbJx2GplnXn4rwI-DRSOKwK-DnwAYvTtrV0xpRCgaRw/exec?page=bridge"></iframe>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getAuth,RecaptchaVerifier,signInWithPhoneNumber,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
const config={apiKey:'AIzaSyCO44jbPyRtHEviHlKscT5zAYDeKudu3pQ',authDomain:'green-basket-f404f.firebaseapp.com',projectId:'green-basket-f404f',appId:'1:551361935382:web:f056173756688da8275d37'};
const auth=getAuth(initializeApp(config));auth.languageCode='en';
const $=id=>document.getElementById(id);let confirmation=null,verifier=null,loading=false,bridgeReady=false,bridgeSource=null,bridgeOrigin=null,pending=null;
const BRIDGE_ORIGINS=new Set(['https://script.google.com']);
const isGoogleBridgeOrigin=origin=>BRIDGE_ORIGINS.has(origin)||/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/i.test(origin);
const say=(s,err=false)=>{$('message').textContent=s;$('message').className=err?'error':''};
function busy(v){loading=v;['send','confirm','refresh'].forEach(id=>$(id).disabled=v)}
function make(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=String(text);return el}
const statuses=['New','Confirmed','Packed','Out for Delivery','Delivered'];
function render(orders){const root=$('orders');root.replaceChildren();root.appendChild(make('h2','','My Orders ('+orders.length+')'));if(!orders.length){root.appendChild(make('p','','No orders found for this verified account.'));return}
for(const o of orders){const card=make('article','order');const top=make('div','top');top.append(make('div','id',o.orderId||'Order'),make('span','pill',o.orderStatus||'New'));card.appendChild(top);card.appendChild(make('p','amount','₹'+(Number(o.total)||0).toFixed(2)));card.appendChild(make('p','muted','Placed: '+(o.createdAt||'—')+' · Delivery: '+(o.deliveryDate||'—')));const step=make('div','steps');const current=statuses.indexOf(o.orderStatus);statuses.forEach((s,i)=>{const node=make('div','step'+(current>=i?' done':''));node.appendChild(make('div','dot'));node.appendChild(make('span','',s));step.appendChild(node)});card.appendChild(step);if(current<0)card.appendChild(make('p','muted','Current status: '+(o.orderStatus||'—')));card.appendChild(make('p','muted','Payment: '+(o.payment||'—')+' · '+(o.paymentStatus||'—')));card.appendChild(make('pre','',o.items||''));root.appendChild(card)}}
window.addEventListener('message',event=>{
 if(!isGoogleBridgeOrigin(event.origin))return;
 const d=event.data;if(!d||typeof d!=='object')return;
 if(d.type==='GB_TEST_ORDERS_READY' && event.source){bridgeReady=true;bridgeSource=event.source;bridgeOrigin=event.origin;return}
 if(d.type==='GB_TEST_ORDERS_RESULT'&&event.source===bridgeSource&&event.origin===bridgeOrigin&&pending&&d.nonce===pending.nonce){const p=pending;pending=null;clearTimeout(p.timer);p.resolve(d.result)}
});
function lookup(token){return new Promise((resolve,reject)=>{
 if(pending){reject(new Error('Order lookup already in progress'));return}
 const bytes=crypto.getRandomValues(new Uint8Array(16));const nonce=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
 const timer=setTimeout(()=>{if(pending?.nonce===nonce){pending=null;reject(new Error('Secure order connection timed out. Check the Apps Script bridge deployment.'))}},20000);
 pending={nonce,timer,resolve,reject};
 // HTML Service uses a Google-controlled nested frame; post to the iframe wrapper and descendants.
 // The bridge accepts messages only from the exact GitHub Pages origin.
 if(!bridgeReady||!bridgeSource){clearTimeout(timer);pending=null;reject(new Error('Order bridge not ready. Refresh after deploying the Apps Script bridge.'));return}
 bridgeSource.postMessage({type:'GB_TEST_ORDERS_REQUEST',nonce,token},bridgeOrigin);
 })}
async function refresh(){const user=auth.currentUser;if(!user)return;busy(true);say('Loading orders from TEST Google Sheet…');try{for(let i=0;i<40&&!bridgeReady;i++)await new Promise(r=>setTimeout(r,250));const token=await user.getIdToken();const result=await lookup(token);if(!result?.success)throw new Error(result?.error||'Unable to load orders');render(result.orders||[]);say('Orders updated from TEST Google Sheet.')}catch(e){say('Unable to load orders: '+(e.message||e),true)}finally{busy(false)}}
$('send').onclick=async()=>{const mobile=$('mobile').value.trim();if(!/^[6-9]\d{9}$/.test(mobile)){say('Enter a valid 10-digit Indian mobile number.',true);return}busy(true);try{if(!verifier){verifier=new RecaptchaVerifier(auth,'recaptcha-container',{size:'normal'});await verifier.render()}confirmation=await signInWithPhoneNumber(auth,'+91'+mobile,verifier);$('verify').classList.remove('hidden');say('OTP requested. Enter your Firebase TEST code.')}catch(e){say('OTP error: '+(e.code||e.message),true);if(verifier){verifier.clear();verifier=null;$('recaptcha-container').replaceChildren()}}finally{busy(false)}};
$('confirm').onclick=async()=>{if(!confirmation){say('Request OTP first.',true);return}busy(true);try{await confirmation.confirm($('code').value.trim());say('Phone verified.')}catch(e){say('Verification failed: '+(e.code||e.message),true)}finally{busy(false)}};
$('refresh').onclick=refresh;$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{$('login').classList.toggle('hidden',!!user);$('account').classList.toggle('hidden',!user);$('intro').textContent=user?'Your verified TEST orders':'Verify your mobile number to see TEST orders.';$('phone').textContent=user?'Verified: '+(user.phoneNumber||''):'';if(user)refresh();else{$('orders').replaceChildren();say('')}});
</script></body></html>
