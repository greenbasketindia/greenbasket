<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>My Orders | Green Basket</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f1;color:#183522;font:15px system-ui,sans-serif}header{background:#0c5f1d;color:white;padding:20px;font-size:20px;font-weight:800}main{max-width:720px;margin:24px auto;padding:0 14px}.panel,article{background:white;border:1px solid #dbe9d8;border-radius:18px;padding:20px;margin-bottom:14px}h1{margin:12px 0}p{line-height:1.5;color:#526557}button,a.back{display:inline-block;border:0;border-radius:10px;padding:12px 16px;background:#0c5f1d;color:white;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;margin:5px 4px 5px 0}button:disabled{opacity:.5}input{width:100%;padding:12px;border:1px solid #bacfba;border-radius:10px;font:inherit;margin:8px 0}label{display:block;font-weight:650}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere}.pill{background:#e8f5e8;padding:5px 10px;border-radius:20px}.amount{font-size:24px;font-weight:800;color:#0c5f1d}.steps{display:flex;gap:4px;margin:16px 0}.step{flex:1;text-align:center;font-size:11px;color:#657466}.dot{width:18px;height:18px;border:2px solid #cbd9c8;border-radius:50%;margin:0 auto 6px}.done .dot{background:#0c5f1d;border-color:#0c5f1d}.error{color:#b42318}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px system-ui}.muted{font-size:12px}#recaptcha-container{overflow:auto}</style></head><body><header>🧺 GREEN BASKET</header><main><section class="panel"><a class="back" href="./GreenBasket_TEST_Integrated_v5_1.html">← Back to shopping</a><h1>My Orders</h1><p id="intro">Checking your account…</p><p class="muted">Preview environment · Never share your OTP.</p><section id="login" class="hidden"><label for="mobile">Mobile number (+91)</label><input id="mobile" maxlength="10" inputmode="numeric" autocomplete="tel-national"><div id="recaptcha-container"></div><button id="send">Send OTP</button><div id="verify" class="hidden"><label for="code">OTP</label><input id="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code"><button id="confirm">Verify OTP</button></div></section><section id="account" class="hidden"><p id="phone"></p><button id="refresh">Refresh orders</button><button id="logout">Sign out</button></section><p id="message" role="status" aria-live="polite"></p></section><section id="orders"></section></main><iframe id="bridge" hidden title="Secure order lookup" referrerpolicy="no-referrer"></iframe><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getAuth,RecaptchaVerifier,signInWithPhoneNumber,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
const auth=getAuth(initializeApp({apiKey:'AIzaSyCO44jbPyRtHEviHlKscT5zAYDeKudu3pQ',authDomain:'green-basket-f404f.firebaseapp.com',projectId:'green-basket-f404f',appId:'1:551361935382:web:f056173756688da8275d37'}));auth.languageCode='en';
const $=id=>document.getElementById(id),random=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
let generation=0,session=random(),peer=null,pending=null,confirmation=null,verifier=null,loading=false;
const say=(s,err=false)=>{$('message').textContent=s;$('message').className=err?'error':''};
function busy(v){loading=v;for(const id of ['send','confirm','refresh'])$(id).disabled=v;}
function inside(w){try{for(let i=0;w&&i<12;i++){if(w===$('bridge').contentWindow)return true;const p=w.parent;if(p===w)return false;w=p;}}catch(_){}return false;}
function originOK(o){return o==='https://script.google.com'||/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/i.test(o)||o==='https://script.googleusercontent.com';}
function reset(){generation++;session=random();peer=null;if(pending){const p=pending;pending=null;clearTimeout(p.timer);p.reject(new Error('Session changed'));} $('orders').replaceChildren();busy(false);$('bridge').src='https://script.google.com/macros/s/AKfycbzstju0kNmWRLTVnQQUsr5gMH2RbJx2GplnXn4rwI-DRSOKwK-DnwAYvTtrV0xpRCgaRw/exec?page=bridge';}
window.addEventListener('message',e=>{if(!originOK(e.origin)||!inside(e.source))return;const d=e.data;if(!d||typeof d!=='object')return;if(d.type==='GB_ORDERS_READY'&&!peer){e.source.postMessage({type:'GB_ORDERS_HELLO',session},e.origin);return;}if(d.session!==session)return;if(d.type==='GB_ORDERS_ACK'&&!peer){peer={source:e.source,origin:e.origin};return;}if(d.type==='GB_ORDERS_RESULT'&&peer&&e.source===peer.source&&e.origin===peer.origin&&pending&&d.nonce===pending.nonce){const p=pending;pending=null;clearTimeout(p.timer);p.resolve(d.result);}});
function lookup(token){return new Promise((resolve,reject)=>{if(!peer||pending){reject(new Error('Connection unavailable'));return;}const nonce=random();const timer=setTimeout(()=>{if(pending?.nonce===nonce){pending=null;reject(new Error('Connection timed out'));}},20000);pending={nonce,timer,resolve,reject};peer.source.postMessage({type:'GB_ORDERS_LOOKUP',session,nonce,token},peer.origin);});}
function make(tag,cls,t){const e=document.createElement(tag);e.className=cls;if(t!==undefined)e.textContent=String(t);return e;}
function render(orders){const root=$('orders');root.replaceChildren();root.append(make('h2','','Orders ('+orders.length+')'));if(!orders.length)root.append(make('p','','No orders found.'));const statuses=['New','Confirmed','Packed','Out for Delivery','Delivered'];for(const o of orders){const a=make('article',''),top=make('div','top');top.append(make('strong','',o.orderId||'Order'),make('span','pill',o.orderStatus||'Unknown'));a.append(top,make('p','amount',Number.isFinite(Number(o.total))?'₹'+Number(o.total).toFixed(2):'Amount unavailable'),make('p','','Placed: '+(o.createdAt||'—')+' · Delivery: '+(o.deliveryDate||'—')));const i=statuses.indexOf(o.orderStatus);if(i>=0){const steps=make('div','steps');statuses.forEach((s,j)=>{const n=make('div','step'+(j<=i?' done':''));n.append(make('div','dot'),make('span','',s));steps.append(n);});a.append(steps);}else if(o.orderStatus==='Cancelled')a.append(make('p','error','This order has been cancelled.'));a.append(make('p','','Payment: '+(o.payment||'—')+' · '+(o.paymentStatus||'—')),make('pre','',o.items||''));root.append(a);}}
async function refresh(){const u=auth.currentUser,g=generation;if(!u||loading)return;const current=()=>g===generation&&auth.currentUser===u;busy(true);say('Loading your orders…');try{for(let i=0;i<80&&!peer&&current();i++)await new Promise(r=>setTimeout(r,250));if(!current())return;const token=await u.getIdToken();if(!current())return;const r=await lookup(token);if(!current())return;if(!r?.success||!Array.isArray(r.orders))throw Error('Lookup failed');render(r.orders);say('Orders updated.');}catch(e){if(current())say('Unable to load orders. Refresh the page and try again.',true);}finally{if(current())busy(false);}}
$('send').onclick=async()=>{if(loading)return;const m=$('mobile').value.trim();if(!/^[6-9]\d{9}$/.test(m)){say('Enter a valid mobile number.',true);return;}busy(true);try{if(!verifier){verifier=new RecaptchaVerifier(auth,'recaptcha-container',{size:'normal'});await verifier.render();}confirmation=await signInWithPhoneNumber(auth,'+91'+m,verifier);$('verify').classList.remove('hidden');say('Enter your OTP.');}catch(e){say('Unable to send OTP. Try again.',true);if(verifier){verifier.clear();verifier=null;}}finally{busy(false);}};
$('confirm').onclick=async()=>{if(!confirmation||loading)return;const g=generation;busy(true);try{await confirmation.confirm($('code').value.trim());}catch(e){if(g===generation)say('OTP verification failed.',true);}finally{if(g===generation)busy(false);}};
$('refresh').onclick=refresh;$('logout').onclick=async()=>{reset();try{await signOut(auth);}catch(e){say('Sign out failed. Try again.',true);}};
onAuthStateChanged(auth,u=>{reset();confirmation=null;$('code').value='';$('verify').classList.add('hidden');$('login').classList.toggle('hidden',!!u);$('account').classList.toggle('hidden',!u);$('intro').textContent=u?'Track your orders and delivery.':'Verify your mobile number to view your orders.';$('phone').textContent=u?'Verified: '+(u.phoneNumber||''):'';say('');if(u)refresh();});
</script></body></html>
